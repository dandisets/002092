description: 'This dataset contains electrophysiological recordings from the medial
  prefrontal cortex (both prelimbic and infralimbic cortices) and hippocampus (dorsal
  CA1 region) in adult Long-Evans rats (n = 8). The medial prefrontal cortex and hippocampus
  were implanted with 16-channel multielectrode arrays in all animals. The thalamic
  nucleus reuniens was injected either with an AAV containing the channelrhodopsin
  (ChR2, n = 4, 1 male and 3 females) or a blank control virus (mCherry, n = 4, 1
  male and 3 females), and implanted with a single fiber optic. Recordings from the
  cortex (2x8 design electrodes) and hippocampus (4x4 design electrodes) took place
  during a baseline session and extinction learning session while the nucleus reuniens
  received theta-paced (8-Hz) opto-stimulation. In the analyses, Channel 1 was used
  as the reference channel. Channels 2-8 corresponded to the infralimbic cortex, Channels
  9-16 corresponded to the prelimbic cortex, and Channels 17-32 corresponded to the
  hippocampus. For details about recording techniques and sessions, please refer to
  Tuna et al. (2025): https://doi.org/10.1016/j.brs.2025.11.011.'
